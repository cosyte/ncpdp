name: Em-dash gate

# The brand rule bans the em dash (U+2014) and the en dash (U+2013) outright across every Cosyte
# surface, commit messages included (the knowledgebase's 06-brand/voice-and-tone.md). This
# workflow is the CI half of that rule for ncpdp: the tracked files and their names, and the text
# that is not a file.
#
# WHAT SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-emdash`, which runs `cosyte-no-emdash`, the
# one implementation of the gate in `@cosyte/script-utils`. What this repository leaves out is in
# `scripts/check-no-emdash.exclude`, with the reason beside each entry. The shared workflow carries
# no pattern, no allow-list and no file selection of its own: it checks the tree out, installs it
# from the committed lockfile (the gate lives in node_modules), runs the command, and lets the
# command's exit status decide the job.
#
# TWO CONTEXTS, NOT ONE, AND THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-emdash` below publishes
# `no-emdash / tracked-files` and `no-emdash / messages`. A branch ruleset binds to those exact
# strings: renaming the job detaches the requirement with no error anywhere, and a required context
# nothing emits blocks every pull request. Do not rename it.
#
#   `no-emdash / tracked-files` is the half that is safe to require and the one that blocks a merge.
#   `no-emdash / messages` reads the pull request title, body and commit messages, reds its own
#   context, and is deliberately NOT required: Dependabot composes a body out of upstream release
#   notes, em dashes included, and a gate that fails on someone else's clock becomes a tax.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml: the trigger. The message half needs the
# `edited` activity type, because this repo squash-merges and the pull request title and body ARE
# the commit message that lands. Re-running the whole CI matrix every time someone fixes a typo in a
# description is a large cost for no extra safety.
#
# Run the file half locally with `pnpm check:no-emdash`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-emdash:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved or deleted by
    # anyone who gains write access to the workflow's repository, so a tag is not a pin. The
    # trailing comment is the published reference that commit was released as.
    uses: cosyte/.github/.github/workflows/gate-no-emdash-install.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be downgraded by its
    # caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
