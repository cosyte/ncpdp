name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:19 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "19 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on Node 22, 24 and 26. Repo-specific extra jobs (e.g. an
  # examples smoke, a starter-kit build) are added on top of this caller, never instead of it.
  # ncpdp ships a PHI scanner (SCRIPT + Telecom), so the shared pipeline's optional PHI-scan step is
  # switched on. Every caller of the shared workflows names one published reference, pinned by its
  # commit, and they move together.
  #
  # actionlint runs on every event, the nightly run included. It used to be skipped on `schedule`,
  # because the shared job ran it through reviewdog, which posts to the event's repository and a
  # `schedule` payload names none. The shared job now runs rhysd/actionlint's own release binary,
  # which only reads the files.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates in test/perf/scaling-gate.perf.ts and their
  #   self-checks, never under coverage;
  # - `bench-compare` (pull requests only): bench/ncpdp.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner. Advisory: it never fails, so never require it.
  # A skipped job satisfies a required check, so require `scaling-gate` only while its input below
  # stays on. The full reading, the budgets and the profile are in bench-reading.yml.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # workflows-2026-11-10-0be6757a7738
    with:
      run-phi-scan: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/ncpdp.bench.mjs

  # Prove the publish pipeline on every push/PR WITHOUT burning a version or needing registry auth
  # (NCPDP-10, mirroring config's REL-PIPE + the x12 close-out). Two auth-free proofs:
  #   1. `pnpm publish --dry-run` exercises the real publish command path (manifest, `files` set,
  #      access, the five subpath exports), the release itself publishes via `changeset publish`, so
  #      this is a faithful proxy. It runs `--ignore-scripts` because the `prepublishOnly` gates
  #      (typecheck/lint/test/build/attw) already run in the `ci` job above on this same commit, and
  #      `prepublishOnly` starts with `pnpm clean` (`rm -rf dist`) which would wipe the just-built dist.
  #   2. `npm pack --dry-run` asserts the publishable tarball assembles with the right file set + built
  #      `dist/` across all subpaths, independent of what's already on npm. A red in either step means
  #      a real release would fail. The real publish runs in release.yml, through npm trusted publishing.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish dry-run
        run: pnpm publish --dry-run --no-git-checks --ignore-scripts
      - name: Pack integrity
        run: npm pack --dry-run --ignore-scripts

  # The runnable programs under examples/. They import the package by name, which resolves through
  # its own `exports` to `dist/`, so the build comes first. Each example checks its own output and
  # exits non-zero on a mismatch. They sit outside the PHI scanner's default roots, so they are
  # scanned here by path. `examples` is a required context (the ci-required-checks ruleset).
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Examples
        run: pnpm examples
      - name: PHI scan (examples)
        run: pnpm phi-scan examples/README.md examples/*.ts

  # The repository's documents, each checked by the shared checker in @cosyte/script-utils: the
  # README against the house skeleton and npm's size limit, CLAUDE.md against the card spec, and
  # the package.json description against the catalog. The job also runs `pnpm check:process`
  # (`cosyte-process check`), which grades the process wiring: the verb scripts,
  # cosyte-process.config.json, and the direct vitest pin. `documents` is a required context
  # (the ci-required-checks ruleset).
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: README
        run: pnpm check:readme
      - name: CLAUDE.md card
        run: pnpm check:claude-card
      - name: Catalog description
        run: pnpm check:catalog
      - name: Process wiring (cosyte-process check)
        run: pnpm check:process
