name: Public-surface gate

# No internal project bookkeeping on any surface a consumer reads (founder directive 2026-07-27).
# Item identifiers (`NCPDP-7`), phase and wave language, ADR numbers, internal repository paths and
# process commentary belong in the changeset, CHANGELOG.md, the commit, the PR and the umbrella's
# plans/, never in README.md, KNOWN-LIMITATIONS.md, docs-content/, the npm description, a JSDoc
# block a consumer's editor renders, or a warning message a consumer reads in their logs.
#
# WHAT SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs` runs `cosyte-internal-refs`,
# the shared gate in `@cosyte/script-utils`, over the public surface, the npm metadata, the `/** */`
# doc comments in `src/`, and the string literals in `src/`, which reach a consumer as warning and
# error message text. Its axes for this package (the project prefixes, the standards designations
# such as `NCPDP-SCRIPT` that must survive, the surface, both source passes, and this repository's
# own samples, runtime-message ones included) are in `scripts/internal-refs.json`.
#
# The shared workflow carries no pattern and no verdict of its own: it checks the tree out, installs
# it from the committed lockfile (the gate lives in node_modules), runs the command, and lets its
# exit status decide the job.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named `<caller job id> / <inner job id>`,
# so the job id `no-internal-refs` below publishes `no-internal-refs / public-surface`, which is the
# context a branch ruleset must require. Renaming the job detaches that requirement with no error
# anywhere, and a required context nothing emits blocks every pull request.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# Identifiers BELONG in the commit, the PR and the changeset, so a PR-text half here would red on
# correct work, and nothing here reads PR text, so there is no `edited` trigger. The half that keeps
# identifiers out of a published RELEASE BODY lives in the shared release pipeline.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved or deleted by
    # anyone who gains write access to the workflow's repository, so a tag is not a pin. The
    # trailing comment is the published reference that commit was released as.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be downgraded by its
    # caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
