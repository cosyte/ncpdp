name: Nightly properties

# The property tests at depth: every property under test/property runs 10,000 cases instead of a
# pull request's count (COSYTE_PROPERTY_RUNS, read by @cosyte/test-utils' runners and by
# test/_helpers/fuzz-config.ts). A failure prints the seed and path that replay it, and the shared
# job keeps each one in its summary and in the `property-run` artifact: set the pair as
# COSYTE_PROPERTY_SEED and COSYTE_PROPERTY_PATH and run `pnpm fuzz` to get the same case, already
# shrunk.
#
# This is the depth run. nightly-fuzz.yml is the other nightly run: the fuzz targets for a time
# budget instead of a case count.

on:
  schedule:
    # 04:29 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "29 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    uses: cosyte/.github/.github/workflows/nightly-properties.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # workflows-2026-11-10-398cd4ded647
    with:
      # The property suites only. The one property outside them, the Telecom round trip in
      # test/telecom/serialize.test.ts, draws from a fixed corpus of messages, so depth adds time
      # there and no new case.
      test-cmd: "pnpm fuzz"
      property-runs: "10000"
