name: Test-selection gate

# A required JOB gates its STEPS. It does not gate what those steps SELECT.
#
# `ci / verify` runs `pnpm test:coverage`, which runs vitest, which runs whatever
# `vitest.config.ts`'s `include` globs select. That single repo-local line is the sole
# selector for every test in this repo: the shared `@cosyte/vitest-config` supplies no
# `include` of its own and spreads this repo's `test` block last. Narrow it to
# `test/script` and `test/telecom` and the PHI-scanner suite and the whole `test/property`
# fuzz layer stop running, while every required check stays green and every ruleset stays
# exactly as configured.
#
# COVERAGE IS NOT A BACKSTOP, which is what makes this silent rather than merely risky.
# The coverage gate measures `src/**/*.ts`. The PHI scanner lives in `scripts/`, and the
# property suites re-walk `src/` paths the unit suites already cover, so dropping either
# costs approximately zero coverage percent.
#
# `scripts/check-test-selection.ts` closes that by comparing the test files that EXIST
# against the test files vitest would actually RUN, and by re-proving on every run that it
# can still see the difference. It also checks the INVOCATION, because resolving the config
# cannot see the command line: narrowing the run with a path filter, an alternate
# `--config`, a `--project` or a `--shard` in the `test` / `test:coverage` scripts leaves
# `vitest.config.ts` looking pristine, and so does delegating those scripts to a third one
# that does any of it. That rule does not parse the script body, it requires an exact
# match against two known-good bodies, because three successive parsing versions each
# shipped an evasion. Its header carries the design rules and the limits.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. Same reasoning as the two gate
# workflows next door. `ci.yml` is a thin caller of
# cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no arbitrary
# repo script. Landing this there would run it for every caller of the shared pipeline,
# and the sibling repos that have the same defect have not fixed it yet, so a shared
# pipeline would be the wrong place to land a rule most of its callers cannot satisfy.
#
# WHY ONE JOB AND NOT TWO. The install and the check are steps of a single job on purpose.
# Promoting either into its own job would leave that half un-required unless the ruleset
# were edited in the same change, which is exactly the class of silent detachment this
# gate exists to answer.
#
# THE JOB ID IS THE REQUIRED CHECK-RUN CONTEXT. `ci-required-checks` (repository ruleset
# id 19841505) requires `test-selection` by that name. Renaming this job without renaming
# the required context does not turn the PR red; it leaves every pull request PENDING and
# unmergeable, with nothing anywhere saying why. Rename both together or neither.
#
# Run it locally with `pnpm check:test-selection`, also reached by `pnpm check`, which is
# on the meta-repo's `scripts/verify.sh ncpdp` ladder.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `|| true`, no `continue-on-error`: a check that cannot fail is documentation.
      # The script seeds a narrowed selection and requires itself to catch it before it
      # reports anything, so a green here is a green from a detector proven able to red.
      - name: Check that CI still selects every test
        run: pnpm check:test-selection
